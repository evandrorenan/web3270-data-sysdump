version: '3.8'

services:
  web3270-data-sysdump:
    image: your_docker_image_name  # Replace with your actual Docker image name
    build:
      context: .
      dockerfile: Dockerfile  # Ensure you have a Dockerfile in your project root
    ports:
      - "8080:8080"  # Map the application port
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@web3270db:27017/${MONGODB_DBNAME}  # Use the new database name
      SPRING_APPLICATION_NAME: web3270-data-sysdump
      # Add other environment variables as needed
      MONGODB_HOST: web3270db
      MONGODB_PORT: 27017
      MONGODB_DBNAME: ${MONGODB_DBNAME}
      MONGODB_USERNAME: ${MONGODB_USERNAME}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD}
      BLOB_REPOSITORY_BUFFER_SIZE: ${BLOB_REPOSITORY_BUFFER_SIZE}
      BLOB_STORAGE_CONNECTION_STRING: ${BLOB_STORAGE_CONNECTION_STRING}
      BLOB_STORAGE_CONTAINER_NAME: ${BLOB_STORAGE_CONTAINER_NAME}
    depends_on:
      - web3270db

  web3270db:
    image: mongo:latest  # Use the latest MongoDB image
    container_name: web3270db  # Rename the container to web3270db
    ports:
      - "27017:27017"  # Expose MongoDB port
    volumes:
      - mongo_data:/data/db  # Persist data
    command: ["mongod", "--bind_ip_all", "--replSet", "rs0"]  # Start MongoDB with replica set
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}  # Optional: Set a root username
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}  # Optional: Set a root password
      MONGO_INITDB_DATABASE: ${MONGODB_DBNAME}  # Create the database

volumes:
  mongo_data: